<html>
 <head>
  <meta charset="utf-8">
  <title>Anzeige</title>
  <link rel="stylesheet" href="css/display.css">
  <script src="js/datafile.js"></script>
  <script src="js/display.js"></script>
  <script src="js/offline.js"></script>
 </head>
 <body class="waiting" onload="init()">
  <section id="welcome">
   <img src="img/logo.jpg" alt="">
   <h1 id="welcomeName"></h1>
   <p id="welcomeNext" hidden><span>Als Nächstes</span><b id="welcomeNextHeat"></b></p>
   <p id="waitingText">Warte auf die Regie &hellip;</p>
  </section>
  <section id="screen">
   <img src="img/logo.jpg" alt="">
   <h1 id="screenTitle"></h1>
   <div id="screenText"></div>
  </section>
  <header>
   <h1 id="heatTitle"></h1>
   <div id="heatBox">Lauf <span id="heat"></span>/<span id="heatCount"></span></div>
   <img src="img/logo.jpg" alt="">
  </header>
  <main>
   <table id="lanes">
    <tr>
     <th class="lane" id="labelHeader">Bahn</th><th class="name" id="nameHeader">Name</th><th class="club" id="clubHeader">Verein</th><th class="born" id="bornHeader">Jahrgang</th><th class="time" id="timeHeader">Meldezeit</th>
    </tr>
    <!-- one row per lane (or per list entry), see showRows() in display.js -->
   </table>
  </main>
  <footer id="next"><span id="nextLabel">Als Nächstes: </span><span id="nextCompetition"></span></footer>
  <div id="fullscreenHint">Klicken oder <kbd>F</kbd> drücken für Vollbild</div>
 </body>
</html>
