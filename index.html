<html>
 <head>
  <meta charset="utf-8">
  <title>Vereinsmeisterschaften 2025</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
 </head>
 <body onload="init()">
  <section id="upload">
   <h1>Vereinsmeisterschaften 2025</h1>
   <label for="dataFile" id="dropZone">
    Datendatei hierher ziehen
    <span>oder</span>
    <input type="file" id="dataFile" accept=".js,.json,.txt">
   </label>
   <p id="uploadError"></p>
   <p id="keyHelp">
    Steuerung: <kbd>→</kbd> / <kbd>Leertaste</kbd> nächster Lauf &middot;
    <kbd>←</kbd> vorheriger Lauf / Begrüßung &middot; <kbd>F</kbd> Vollbild
   </p>
  </section>
  <section id="welcome">
   <img src="img/logo.jpg" alt="">
   <h1 id="welcomeName"></h1>
  </section>
  <header>
   <h1>Wettkampf <span id="competitionId"></span> &ndash; <span id="competition"></span></h1>
   <div id="heatBox">Lauf <span id="heat"></span>/<span id="heatCount"></span></div>
   <img src="img/logo.jpg" alt="">
  </header>
  <main>
   <table>
    <tr>
     <th class="lane">Bahn</th><th class="name">Name</th><th class="born">Jahrgang</th><th class="time">Meldezeit</th>
    </tr>
    <tr>
     <td class="lane">1</td><td class="name" id="name1"></td><td id="born1"></td><td id="time1"></td>
    </tr>
    <tr>
     <td class="lane">2</td><td class="name" id="name2"></td><td id="born2"></td><td id="time2"></td>
    </tr>
    <tr>
     <td class="lane">3</td><td class="name" id="name3"></td><td id="born3"></td><td id="time3"></td>
    </tr>
    <tr>
     <td class="lane">4</td><td class="name" id="name4"></td><td id="born4"></td><td id="time4"></td>
    </tr>
   </table>
  </main>
  <footer id="next">Als Nächstes: <span id="nextCompetition"></span></footer>
  <div id="notice" hidden></div>
 </body>
</html>
