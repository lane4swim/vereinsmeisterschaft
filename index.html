<html>
 <head>
  <meta charset="utf-8">
  <title>Regie – Vereinsmeisterschaften</title>
  <link rel="stylesheet" href="css/control.css">
  <script src="js/datafile.js"></script>
  <script src="js/startlist-csv.js"></script>
  <script src="js/control.js"></script>
 </head>
 <body onload="init()">
  <section id="upload">
   <h1>Vereinsmeisterschaften &ndash; Regie</h1>
   <label for="dataFile" id="dropZone">
    Datendatei hierher ziehen
    <span>oder</span>
    <input type="file" id="dataFile" accept=".json,.csv,.js,.txt">
   </label>
   <p id="csvOption">
    <label>Name der Veranstaltung für CSV-Startlisten:
     <input type="text" id="csvEventName" placeholder="leer: Vereinsmeisterschaften + Jahr"></label>
   </p>
   <p id="uploadError"></p>
   <p id="demo">
    Zum Ausprobieren:
    <button id="loadSample">Beispieldaten laden</button>
   </p>
  </section>

  <section id="control">
   <header>
    <div id="clock" aria-label="Uhrzeit"></div>
    <div id="schedule" hidden></div>
    <h1 id="eventName"></h1>
    <span id="demoBadge" class="pill warn" hidden>Beispieldaten</span>
    <div id="status">
     <span id="stDisplay" class="pill"></span>
     <span id="stFullscreen" class="pill"></span>
     <span id="stWakeLock" class="pill"></span>
    </div>
    <button id="openDisplay">Anzeige öffnen</button>
   </header>
   <nav id="heatList" aria-label="Alle Läufe"></nav>
   <main>
    <div id="panels">
     <section class="panel" id="nowPanel">
      <h2>Jetzt auf der Anzeige</h2>
      <div id="nowView" class="preview"></div>
     </section>
     <section class="panel" id="nextPanel">
      <h2>Als Nächstes <small>(Weiter)</small></h2>
      <div id="nextView" class="preview"></div>
     </section>
    </div>
    <div id="buttons">
     <button id="back">&#9664; Zurück</button>
     <button id="welcomeBreak">Begrüßung zeigen<small id="welcomeResume"></small></button>
     <button id="forward">Weiter &#9654;</button>
    </div>
    <label id="clubOption">
     <input type="checkbox" id="showClub"> Verein in der Tabelle auf der Anzeige zeigen
    </label>
    <p id="keyHelp">
     <kbd>→</kbd> / <kbd>Leertaste</kbd> weiter &middot; <kbd>←</kbd> zurück &middot;
     <kbd>B</kbd> Begrüßung, danach nächster Lauf &middot;
     Vollbild: auf der Anzeige klicken oder <kbd>F</kbd>
    </p>
   </main>
  </section>
  <div id="notice" hidden></div>
 </body>
</html>
